<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#20242a">
<meta name="description" content="Подбор раскладки фишек гекс-календаря под дату">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Гекс-календарь">
<title>Гекс-календарь: решатель раскладки</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;background:#20242a;color:#eee;margin:0;padding:14px;text-align:center;
       padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  h1{font-size:19px;margin:0 auto}
  .panel{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px auto}
  select,button{font-size:19px;padding:10px 12px;border-radius:10px;border:1px solid #555;background:#333;color:#eee}
  select{min-width:64px;text-align:center}
  #mo{min-width:86px} #yr{min-width:86px} #wd{min-width:70px}
  button{cursor:pointer;background:#e6c447;color:#222;font-weight:700;padding:10px 18px}
  #msg{margin:6px auto;min-height:22px;color:#9f9;max-width:1100px;font-size:16px}
  #wrap{max-width:880px;margin:0 auto}
  #board{width:100%;height:auto;display:block;margin:0 auto}
  .lbl{font:700 11px system-ui;fill:#222;text-anchor:middle;dominant-baseline:central}
  .note{color:#aaa;font-size:13px;max-width:1100px;margin:10px auto;text-align:left}
</style>
</head>
<body>
<h1>Календарь‑головоломка (гекс) — подбор раскладки под дату</h1>
<div class="panel">
  <select id="day"  title="День"></select>
  <select id="mo"   title="Месяц"></select>
  <select id="yr"   title="Год"></select>
  <select id="wd"   title="День недели"></select>
  <button id="solve">Решить</button>
</div>
<div id="msg"></div>
<div id="wrap"><svg id="board"></svg></div>
<p class="note">Фишка на поле рисуется слитно, линия — только по внешнему периметру.
Формы правятся в массиве PIECES (локальные [X,Y]; соседи (X±2,Y) и (X±1,Y±1)).</p>
<script>
/* ---------- доска ---------- */
const ROWS=[6,7,8,8,8,7,6], SH=[3,2,1,0,1,2,3];
const LABELS=[
 ['Янв','Фев','Мар','Апр','Май','Июн'],
 ['Июл','Авг','Сен','Окт','Ноя','Дек','Пн'],
 ['1','2','3','4','5','6','7','Вт'],
 ['8','9','10','11','12','13','14','Ср'],
 ['15','16','17','18','19','20','21','Чт'],
 ['22','23','24','25','26','27','Пт'],
 ['28','29','30','31','Вс','Сб']];
const CELLS=[], LABEL={}, LABEL_UV={};
for(let r=0;r<7;r++)for(let c=0;c<ROWS[r];c++){
  const X=2*c+SH[r], Y=r; CELLS.push([X,Y]);
  LABEL[X+','+Y]=LABELS[r][c]; LABEL_UV[LABELS[r][c]]=(X-Y)+','+(2*Y);
}
const N=CELLS.length, UV=CELLS.map(([X,Y])=>[X-Y,2*Y]);
const IDX=new Map(UV.map((uv,i)=>[uv.join(','),i]));
/* ---------- фишки ---------- */
const PIECES=[
 {col:'#383838',line:'#d8c6ae',name:'ч5 гантель', cells:[[0,0],[2,0],[1,1],[0,2],[2,2]]},
 {col:'#383838',line:'#d8c6ae',name:'ч5 P',       cells:[[0,0],[2,0],[4,0],[1,1],[3,1]]},
 {col:'#383838',line:'#d8c6ae',name:'ч4 ромб',    cells:[[0,0],[2,0],[1,1],[3,1]]},
 {col:'#383838',line:'#d8c6ae',name:'ч3 трилистник',cells:[[0,0],[2,0],[1,1]]},
 {col:'#8f979e',name:'с4 T',       cells:[[0,0],[2,0],[4,0],[3,1]]},
 {col:'#8f979e',name:'с4 3+бок',   cells:[[0,0],[2,0],[4,0],[5,1]]},
 {col:'#8f979e',name:'с4 ромб',    cells:[[0,0],[2,0],[1,1],[3,1]]},
 {col:'#8f979e',name:'с3 дуга',    cells:[[0,0],[2,0],[3,1]]},
 {col:'#e6c447',name:'ж3 дуга',    cells:[[0,0],[2,0],[3,1]]},
 {col:'#e6c447',name:'ж4 I',       cells:[[0,0],[2,0],[4,0],[6,0]]},
 {col:'#e6c447',name:'ж4 3+бок',   cells:[[0,0],[2,0],[4,0],[5,1]]},
 {col:'#e6c447',name:'ж4 T',       cells:[[0,0],[2,0],[4,0],[3,1]]}
];
/* ---------- ориентации (повороты + зеркало) ---------- */
const toUV=([X,Y])=>[X-Y,2*Y];
function norm(cs){const mu=Math.min(...cs.map(p=>p[0])),mv=Math.min(...cs.map(p=>p[1]));
  return cs.map(([u,v])=>[u-mu,v-mv]).sort((a,b)=>a[1]-b[1]||a[0]-b[0]);}
PIECES.forEach(p=>{
  const seen=new Set(), ors=[]; let cs=p.cells.map(toUV);
  for(let m=0;m<2;m++){for(let k=0;k<6;k++){
    const n=norm(cs), key=n.map(q=>q.join(',')).join(';');
    if(!seen.has(key)){seen.add(key);ors.push(n);}
    cs=cs.map(([u,v])=>[-v,u+v]);}
    cs=cs.map(([u,v])=>[-u-v,v]);}
  p.combos=[];
  for(const o of ors)for(let j=0;j<o.length;j++){
    const [au,av]=o[j];
    p.combos.push(o.map(([u,v])=>[u-au,v-av]));
  }
});
/* ---------- решатель ---------- */
function solve(openUV){
  const occ=new Int8Array(N);
  for(const k of openUV)occ[IDX.get(k)]=1;
  const used=PIECES.map(()=>false), place=PIECES.map(()=>null);
  let nodes=0, dead=false; const t0=performance.now();
  function bt(){
    if((nodes++&2047)===0 && performance.now()-t0>4000){dead=true;return false;}
    let t=-1; for(let i=0;i<N;i++)if(!occ[i]){t=i;break;}
    if(t<0)return true;
    const [tU,tV]=UV[t];
    for(let p=0;p<PIECES.length;p++){
      if(used[p])continue;
      const cb=PIECES[p].combos;
      for(let ci=0;ci<cb.length;ci++){
        const offs=cb[ci], ks=[]; let ok=true;
        for(const[du,dv]of offs){
          const k=IDX.get((tU+du)+','+(tV+dv));
          if(k===undefined||occ[k]){ok=false;break;}
          ks.push(k);
        }
        if(!ok)continue;
        for(const k of ks)occ[k]=1; used[p]=true;
        if(bt()){place[p]=ks;return true;}
        for(const k of ks)occ[k]=0; used[p]=false;
        if(dead)return false;
      }
    }
    return false;
  }
  return bt()?place:null;
}
/* ---------- геометрия: заливка + периметр ---------- */
const S=34, K=Math.sqrt(3)*S/2;
const DIRS=[[2,0,330,30],[1,1,30,90],[-1,1,90,150],[-2,0,150,210],[-1,-1,210,270],[1,-1,270,330]];
function vtx(cx,cy,s,a){const r=Math.PI/180*a;return [cx+s*Math.cos(r), cy+s*Math.sin(r)];}
function hexPath(cx,cy,s){let d='';for(let i=0;i<6;i++){const [x,y]=vtx(cx,cy,s,30+60*i);
  d+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1);}return d+'Z';}
function pieceSVG(cells,s,fill,sw,line='#14161a'){
  const k=Math.sqrt(3)*s/2, set=new Set(cells.map(([X,Y])=>X+','+Y));
  let out='';
  for(const[X,Y]of cells)out+=`<path d="${hexPath(X*k,Y*1.5*s,s)}" fill="${fill}" stroke="none"/>`;
  for(const[X,Y]of cells)for(const[dx,dy,a1,a2]of DIRS){
    if(!set.has((X+dx)+','+(Y+dy))){
      const [x1,y1]=vtx(X*k,Y*1.5*s,s,a1),[x2,y2]=vtx(X*k,Y*1.5*s,s,a2);
      out+=`<path d="M${x1.toFixed(1)},${y1.toFixed(1)}L${x2.toFixed(1)},${y2.toFixed(1)}" stroke="${line}" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`;
    }}
  return out;
}
/* ---------- поле головоломки ---------- */
const svg=document.getElementById('board');
function draw(place,openTexts){
  const cx=CELLS.map(([X,Y])=>X*K), cy=CELLS.map(([X,Y])=>Y*1.5*S);
  const L=Math.min(...cx)-K-6, R=Math.max(...cx)+K+6, T=Math.min(...cy)-S-6, B=Math.max(...cy)+S-6, M=18;
  const W=R-L+2*M, H=B-T+2*M;
  svg.setAttribute('viewBox',`${L-M} ${T-M} ${W} ${H}`);
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  let out=`<rect x="${L-M}" y="${T-M}" width="${W}" height="${H}" rx="18" fill="#e8d9c8"/>`;
  if(place){
    // сначала фишки с тёмным контуром, затем со светлым — чтобы светлый контур был сверху
    const order=place.map((_,i)=>i).sort((a,b)=>!!PIECES[a].line-!!PIECES[b].line);
    for(const i of order){ const ks=place[i]; if(!ks)continue;
      out+=pieceSVG(ks.map(k=>CELLS[k]),S,PIECES[i].col,PIECES[i].line?3:2,PIECES[i].line);
    }
  }
  for(let i=0;i<N;i++){
    const txt=LABEL[CELLS[i].join(',')];
    const isOpen=openTexts.has(txt);
    if(isOpen)out+=`<path d="${hexPath(cx[i],cy[i],S)}" fill="#efe3d3" stroke="#14161a" stroke-width="1.4"/>`;
    else if(!place)out+=`<path d="${hexPath(cx[i],cy[i],S)}" fill="#f4ead9" stroke="#14161a" stroke-width="1.4"/>`;
    if(isOpen||!place)out+=`<text class="lbl" x="${cx[i]}" y="${cy[i]}">${txt}</text>`;
  }
  svg.innerHTML=out;
}
/* ---------- UI ---------- */
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'], MO=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const dS=document.getElementById('day'),wS=document.getElementById('wd'),mS=document.getElementById('mo'),yS=document.getElementById('yr');
WD.forEach(w=>wS.add(new Option(w,w)));
const now=new Date(), Y0=now.getFullYear();
for(let y=Y0-2;y<=Y0+6;y++)yS.add(new Option(y,y));
for(let m=0;m<12;m++)mS.add(new Option(MO[m],m));
function fillDays(){
  const y=+yS.value, m=+mS.value, dim=new Date(y,m+1,0).getDate(), d=Math.min(+dS.value||1,dim);
  dS.innerHTML=''; for(let i=1;i<=dim;i++)dS.add(new Option(i,i)); dS.value=d;
}
function syncWD(){ wS.value=WD[(new Date(+yS.value,+mS.value,+dS.value).getDay()+6)%7]; }
yS.value=Y0; mS.value=now.getMonth(); fillDays(); dS.value=now.getDate(); syncWD();
const msg=document.getElementById('msg');
function run(){
  const texts=[String(dS.value),wS.value,MO[+mS.value]];
  if(new Set(texts).size<3){msg.textContent='Конфликт меток — такая комбинация на доске невозможна.';draw(null,new Set(texts));return;}
  msg.textContent='Решаю…';
  setTimeout(()=>{
    const t0=performance.now(), res=solve(texts.map(t=>LABEL_UV[t]));
    const ms=Math.round(performance.now()-t0);
    if(res){msg.textContent=`Готово (${ms} мс): ${wS.value}, ${dS.value} ${MO[+mS.value]} ${yS.value}.`;draw(res,new Set(texts));}
    else{msg.textContent='Для этой даты раскладка не найдена.';draw(null,new Set(texts));}
  },20);
}
yS.onchange=()=>{fillDays();syncWD();run();};
mS.onchange=()=>{fillDays();syncWD();run();};
dS.onchange=()=>{syncWD();run();};
wS.onchange=run;
document.getElementById('solve').onclick=run;
run();
/* ---------- PWA: регистрация service worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW:',e)));
}
</script>
</body>
</html>
